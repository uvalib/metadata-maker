<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Metadata Maker for Serials</title>

	<!-- Tailwind CSS CDN -->
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'uva-blue': '#232D4B',
						'uva-orange': '#E57200'
					},
					fontFamily: {
						'sans': ['Inter', 'system-ui', 'sans-serif']
					}
				}
			}
		}
	</script>
	<!-- Top navigation styles -->
	<link href="/top_bar.css" rel="stylesheet" media="screen">
	<!-- Google fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css?family=Inter" rel="stylesheet" />
	<style type="text/tailwindcss">
		.input-base {
			@apply border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-uva-blue focus:border-transparent;
		}
		.btn-secondary {
			@apply bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-1 px-3 rounded border border-gray-300;
		}
	</style>

	<!-- Lit Components -->
	<script type="module" src="/shared/components/top-navigation.js"></script>
	<script type="module" src="/shared/components/standard-text-input.js"></script>
	<script type="module" src="/shared/components/language-select.js"></script>
	<script type="module" src="/shared/components/repeatable-text-input.js"></script>
	<script type="module" src="/shared/components/insert-diacritics.js"></script>
	<script type="module" src="../shared/components/corporate-organization-input.js"></script>
	<script type="module" src="/shared/components/meta-input.js"></script>

	<style type="text/tailwindcss">
		@layer components {
			.standard-block {
				@apply bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6;
			}
			.heading {
				@apply block text-lg font-bold text-uva-blue mb-2;
			}
			.input-base {
				@apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-uva-orange focus:border-transparent;
			}
			.btn-primary {
				@apply bg-uva-blue text-white px-4 py-2 rounded hover:bg-blue-900 transition-colors cursor-pointer;
			}
			.btn-secondary {
				@apply bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition-colors cursor-pointer;
			}
			.required_marker {
				@apply text-red-600 ml-1;
			}
			/* Legacy overrides */
			.hidden { display: none; }
		}
	</style>
</head>

<script>document.documentElement.classList.add('has-js');</script>

<body class="template template-serials bg-gray-50 font-sans">
	<uv-top-navigation current-version="serials" version-label="Serials"></uv-top-navigation>

	<div id="warning_system">
		<noscript>WARNING: JavaScript is not enabled on this browser. This page requires JavaScript to function
			correctly.</noscript>
		<script src="../shared/checkServer.js"></script>
	</div>
	<div id="content" class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-6">
		<form id="marc-maker">
			<meta-input label="Title" field-id="title" input-class="required translit-listen"
				help-text="Record the title as it appears on the title page. If the title includes a subtitle, record only the main title here, and the subtitle in the next field."
				required sp-chars></meta-input>

			<meta-input container-id="subtitle-block" label="Subtitle" field-id="subtitle" input-class="conditional"
				help-text="Record the subtitle if one exists" unlisted-option sp-chars></meta-input>

			<div id="translit-title-block"
				class="translit-title-block translit-block standard-translit-block translit-title hidden standard-block">
				<label for="translit_title" class="hidden translit heading translit-title">Transliterated
					title</label><label for="translit_title" class="insert insert_normal hidden translit translit-title"
					style="left: -13px;" onClick='insertMenu("translit_title");'>Insert Special Characters</label><br>
				<div id="insert-translit_title" class="hidden translit translit-title"></div>
				<input type="text" id="translit_title" class="hidden translit translit-title">
			</div>

			<div id="translit-subtitle-block"
				class="translit-title-block translit-block standard-translit-block translit-title hidden standard-block">
				<label for="translit_subtitle" class="hidden translit heading translit-title">Transliterated
					subtitle</label><label for="translit_subtitle"
					class="insert insert_normal hidden translit translit-title"
					onClick='insertMenu("translit_subtitle");'>Insert Special Characters</label><br>
				<div id="insert-translit_subtitle" class="hidden translit translit-title"></div>
				<input type="text" id="translit_subtitle" class="hidden translit translit-title">
			</div>

			<meta-input label="Varying title" field-id="varying-title-dropdown" varying-title
				unlisted-option></meta-input>

			<div id="varying-title-block" class="standard-block hidden">
				<input type="text" id="varying_title">
			</div>

			<meta-input label="ISSN" field-id="issn" required input-class="conditional"
				help-text="Record an ISSN, if present. Do not record hyphens. If multiple ISSNs are present, record only one. E.g., 9781234567890 or 1234567890"
				unlisted-option></meta-input>

			<language-select required field-id="language" container-id="language-block"></language-select>

			<div id="names_title" class="heading">Names<br></div>
			<div class="standard-block">
				<corporate-organization-input></corporate-organization-input>
			</div>

			<meta-input label="Name of publisher" field-id="publisher" input-class="conditional translit-listen"
				help-text="Record the name of the publisher as it appears on the piece. Prefer the name that appears on the title page."
				sp-chars unlisted-option required></meta-input>

			<div id="translit-publisher-block"
				class="translit-publisher-block translit-block hidden standard-translit-block standard-block">
				<label for="translit_publisher" class="hidden translit heading translit-publisher">Transliterated
					publisher</label><label for="translit_publisher"
					class="insert insert_normal hidden translit translit-publisher"
					onClick='insertMenu("translit_publisher");'>Insert Special Characters</label><br>
				<div id="insert-translit_publisher" class="hidden translit translit-publisher"></div>
				<input type="text" id="translit_publisher" class="hidden translit translit-publisher">
			</div>

			<meta-input container-id="place-block" label="Place of publication" field-id="place" required
				input-class="conditional translit-listen"
				help-text="Record the place of publication as it appears on the piece. Prefer the place that appears on the title page. If there is more than one place, record only one. E.g., Boston, Massachusetts"
				sp-chars unlisted-option></meta-input>

			<div id="translit-place-block"
				class="translit-place-block translit-block hidden standard-translit-block standard-block">
				<label for="translit_place" class="hidden translit heading translit-place">Transliterated
					place</label><label for="translit_place"
					class="insert insert_normal hidden translit translit-publisher"
					onClick='insertMenu("translit_place");'>Insert Special Characters</label><br>
				<div id="insert-translit_place" class="hidden translit translit-publisher"></div>
				<input type="text" id="translit_place" class="hidden translit translit-place">
			</div>

			<meta-input container-id="country-block" label="Country/State/Province of publication" field-id="country"
				required country input-class="conditional"
				help-text="Select the country of publication from the drop-down menu. If published in the United States, Canada, Australia, or the United Kingdom, select the state, province, or geographic region"
				unlisted-option></meta-input>

			<meta-input label="Publication year" field-id="publication_year" date></meta-input>

			<meta-input label="Publication status" field-id="publication-status-dropdown"
				publication-status></meta-input>

			<div id="volumes-block" class="standard-block hidden">
				<label for="number" class="heading">Number of Volumes</label>
				<input type="text" id="volumes">
				<label title="Record the number of volumes in each numbered sequence. E.g., 4"><span
						class="question-mark">?</span></label>
			</div>

			<meta-input label="Starting date" field-id="year" date required unlisted-option
				help-text="Record the starting year of publication if it appears on the piece."></meta-input>

			<meta-input label="Ending date" field-id="edate" date unlisted-option
				help-text="Record the ending year of publication if it appears on the piece."></meta-input>

			<meta-input label="Dimensions" field-id="dimensions" required suffix=" cm"
				help-text="Record the height of the piece in cm. Always round up, so that if a piece measures 25.1 cm, record 26 cm"></meta-input>

			<div id="literature-block" class="standard-block">
				<label for="literature" class="heading">Is this item literature?</label><br>
				<input type="radio" name="literature" id="literature-yes" value="yes">Yes
				<input type="radio" name="literature" id="literature-no" value="no">No<br>
				<select name="literature-dropdown" id="literature-dropdown" class="hidden">
					<option selected disabled hidden value=''></option>
					<option value="0">Not fiction (not further specified)</option>
					<option value="1">Fiction (not further specified)</option>
					<option value="d">Dramas</option>
					<option value="e">Essays</option>
					<option value="f">Novels</option>
					<option value="h">Humor, satires, etc.</option>
					<option value="i">Letters</option>
					<option value="j">Short stories</option>
					<option value="m">Mixed forms</option>
					<option value="p">Poetry</option>
					<option value="s">Speeches</option>
					<option value="u">Unknown</option>
				</select>
			</div>

			<meta-input label="Type of resource" field-id="resource_type" resource-type></meta-input>

			<meta-input label="Physical form" field-id="physical-form" physical-form></meta-input>

			<div id="government_publication-block" class="standard-block">
				<label for="government_publication" class="heading">Is this a Government Publication?</label><br>
				<input type="radio" name="government_publication" id="government_publication-yes" value="yes">Yes
				<input type="radio" name="government_publication" id="government_publication-no" value="no">No
			</div>

			<meta-input label="Current publication frequency" field-id="current_publication_frequency"
				frequency></meta-input>

			<meta-input label="Regularity" field-id="regularity_dropdown" required regularity></meta-input>

			<meta-input label="Description about the resource" field-id="description" textarea></meta-input>

			<div id="e-resource-block" class="standard-block">
				<label for="e-resource" class="heading">Available as e-resource?</label><br>
				<input type="radio" name="e-resource" id="e-resource-yes" value="yes">Yes
				<input type="radio" name="e-resource" id="e-resource-no" value="no">No
			</div>

			<meta-input container-id="web-url-block" label="Web URL" field-id="web-url"
				container-class="standard-block hidden" url sp-chars></meta-input>

			<meta-input label="Preceding title" field-id="preceding_title" required input-class="conditional"
				unlisted-option></meta-input>

			<meta-input label="Relationship with preceding title" field-id="relationship_with_preceding_title" required
				relationship-preceding unlisted-option></meta-input>

			<meta-input label="Succeeding title" field-id="succeeding_title" required input-class="conditional"
				unlisted-option></meta-input>

			<meta-input label="Relationship with succeeding title" field-id="relationship_with_succeeding_title"
				required relationship-succeeding unlisted-option></meta-input>

			<div id="keywords" class="standard-block">
				<label for="keywords" class="heading">Keywords<span class="required_marker">*</span></label><br />
				<input type="text" class="fastID hidden" id="fastID0" />
				<input type="number" class="fastType hidden" id="fastType0" />
				<input type="text" class="fastInd hidden" id="fastInd0" />
				<div class="flex gap-2 items-center mb-2">
					<input type="text" class="keyword required input-base" required id="keyword0" />
					<label
						title="Record, in English, any descriptive terms that describe the content of this book. Record only one term or phrase in each box. E.g., Astronomy or Politics of Egypt"><span
							class="question-mark text-uva-orange cursor-help">?</span></label>
					<input type="button" value="+" id="add-button" onClick="addKeyword();" class="btn-primary ml-2" />
				</div>
			</div>

			<div id="notes-block" class="standard-block">
				<label for="notes" class="heading">Notes to the Cataloger</label><br />
				<textarea id="notes" class="input-base h-32"></textarea>
			</div>

			<div id="save-as-block" class="standard-block">
				<label for="filename" class="heading">Save as</label>
				<input type="text" id="filename" placeholder="record" class="input-base">.[file type]
			</div>

			<div id="formats-block" class="standard-block">
				<label for="filetype">Choose record formats:</label><br>
				<input type="checkbox" id="MARC" class="filetype">MARC<br>
				<input type="checkbox" id="MARCXML" class="filetype">MARCXML<br>
				<input type="checkbox" id="MODS" class="filetype">MODS<br>
				<input type="checkbox" id="HTML" class="filetype">HTML
			</div>

			<div id="buttons" class="standard-block flex gap-4">
				<input type="submit" value="Make" id="make" class="btn-primary">
				<input type="reset" value="Clear" id="Clear" class="btn-secondary">
			</div>

			<div id="star" class="required_marker standard-block">
				* Required field
			</div>
		</form>
		<div id="disclaimer">The Metadata Maker Project was funded by the University of Illinois at Urbana-Champaign
			Library's Innovation and Seed Funds.</div>
		<div id="version">Version 1.1 – Updated on 11/10/2022</div>
		<a id="code" href="https://github.com/UIUCLibrary/metadata-maker/tree/Serials">GitHub</a>
	</div>

	<script type="module" src="../shared/components/corporate-organization-input.js"></script>
	<script type="module" src="../shared/components/insert-diacritics.js"></script>
	<script src="../shared/generalInteractionsBase.js"></script>
	<script src="metadatamaker/generalInteractions.js"></script>

	<!-- Shared Builders (Must be loaded before download scripts) -->
	<script src="../shared/modsBuilder.js"></script>
	<script src="../shared/htmlBuilder.js"></script>

	<script type="module" src="metadatamaker/downloadMARC.js"></script>
	<script src="metadatamaker/downloadMODS.js"></script>
	<script src="/shared/languageLookups.js"></script>
	<script src="/shared/countryLookups.js"></script>
	<script src="metadatamaker/downloadHTML.js"></script>
	<script src="../shared/sharedUtils.js"></script>
	<script src="metadatamaker/submitForm.js"></script>
	</div>
</body>

</html>

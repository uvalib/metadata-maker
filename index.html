<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<script>document.documentElement.classList.add('has-js');</script>
	<title>Metadata Maker</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.0/jquery-ui.min.js"></script>
	<script src="assignFAST/assignFASTExample.js"></script>
	<script src="assignFAST/assignFASTGadget.js"></script>
	<script src="assignFAST/assignFASTComplete.js"></script>
	<script type="module" src="/shared/components/top-navigation.js"></script>
	<script type="module" src="/shared/components/standard-text-input.js"></script>
	<script type="module" src="/shared/components/meta-input.js"></script>
	<script type="module" src="/shared/components/language-select.js"></script>
	<script type="module" src="/shared/components/author-input.js"></script>

	<link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.0/themes/smoothness/jquery-ui.css" rel="stylesheet">
	<link href="https://jqueryui.com/jquery-wp-content/themes/jqueryui.com/style.css" rel="stylesheet">
	<link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Raleway' rel='stylesheet' type='text/css'>
	<link href="/top_bar.css" rel="stylesheet" media="screen">

	<!-- Tailwind CSS -->
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'uva-blue': '#232D4B',
						'uva-orange': '#E57200',
					},
					fontFamily: {
						sans: ['Franklin Gothic', 'Arial', 'sans-serif'],
					}
				}
			}
		}
	</script>
	<style type="text/tailwindcss">
		@layer components {
			.standard-block {
				@apply bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6;
			}
			.heading {
				@apply block text-lg font-bold text-uva-blue mb-2;
			}
			.input-base {
				@apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-uva-orange focus:border-transparent;
			}
			.btn-primary {
				@apply bg-uva-blue text-white px-4 py-2 rounded hover:bg-blue-900 transition-colors cursor-pointer;
			}
			.btn-secondary {
				@apply bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition-colors cursor-pointer;
			}
			.required_marker {
				@apply text-red-600 ml-1;
			}
			/* Legacy overrides */
			.hidden { display: none; }
		}
	</style>
</head>

<body class="template template-monographs bg-gray-50 font-sans text-gray-800">
	<uv-top-navigation current-version="monographs" version-label="Monographs">
	</uv-top-navigation>

	<div id="warning_system">
		<noscript>WARNING: JavaScript is not enabled on this browser. This page requires JavaScript to function
			correctly.</noscript>
		<!--Allow Safari and older versions of IE to behave as if they implement HTML5's 'required' attribute-->
		<script src="shared/checkServer.js"></script>
	</div>
	<div id="content" class="container mx-auto p-4 pt-20 max-w-4xl">
		<form id="marc-maker">
			<meta-input label="Title" field-id="title" input-class="required translit-listen"
				help-text="Record the title as it appears on the title page. If the title includes a subtitle, record only the main title here, and the subtitle in the next field."
				required sp-chars></meta-input>

			<meta-input container-id="subtitle-block" label="Subtitle" field-id="subtitle" input-class="conditional"
				help-text="Record the subtitle if one exists" unlisted-option></meta-input>

			<div id="translit-title-block"
				class="translit-title-block translit-block standard-translit-block translit-title hidden standard-block">
				<label for="translit_title" class="hidden translit heading translit-title">Transliterated
					title</label><label for="translit_title"
					class="insert insert_normal hidden translit translit-title text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					style="left: -13px;" onClick='insertMenu("translit_title");'>Insert Special Characters</label><br>
				<div id="insert-translit_title" class="hidden translit translit-title"></div>
				<input type="text" id="translit_title" class="hidden translit translit-title input-base">
			</div>

			<div id="translit-subtitle-block"
				class="translit-title-block translit-block standard-translit-block translit-title hidden standard-block">
				<label for="translit_subtitle" class="hidden translit heading translit-title">Transliterated
					subtitle</label><label for="translit_subtitle"
					class="insert insert_normal hidden translit translit-title text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					onClick='insertMenu("translit_subtitle");'>Insert Special Characters</label><br>
				<div id="insert-translit_subtitle" class="hidden translit translit-title"></div>
				<input type="text" id="translit_subtitle" class="hidden translit translit-title input-base">
			</div>

			<div id="isbn-block" class="standard-block">
				<label for="isbn" class="heading">ISBN<span class="required_marker text-red-600">*</span></label><br>
				<input type="text" required id="isbn" class="conditional input-base">
				<label
					title="Record an ISBN, if present. Do not record hyphens. If multiple ISBNs are present, record only one. E.g., 9781234567890 or 1234567890"><span
						class="question-mark text-gray-500 ml-2 cursor-help">?</span></label><br>
				<div class="mt-2">
					<span class="unlisted text-sm text-gray-600">Unlisted</span><input type="checkbox" id="isbn_listed"
						class="listed ml-2">
				</div>
			</div>

			<div id="edition-block" class="standard-block">
				<label for="edition" class="heading">Edition statement<span
						class="required_marker text-red-600">*</span></label><label for="edition"
					class="insert insert_normal text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					onClick='insertMenu("edition");'>Insert Special Characters</label><br>
				<div id="insert-edition"></div>
				<input type="text" class="conditional translit-listen input-base" required id="edition">
				<label
					title="Record an edition statement if it appears on the piece. E.g., First edition, 1st ed., etc."><span
						class="question-mark text-gray-500 ml-2 cursor-help">?</span></label><br>
				<div class="mt-2">
					<span class="unlisted text-sm text-gray-600">Unlisted</span><input type="checkbox"
						id="edition_listed" class="listed ml-2">
				</div>
			</div>

			<div id="translit-edition-block"
				class="translit-edition-block translit-block hidden standard-translit-block standard-block">
				<label for="translit_edition" class="hidden translit heading translit-edition">Transliterated
					edition</label><label for="translit_edition"
					class="insert insert_normal hidden translit translit-edition text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					onClick='insertMenu("translit_edition");'>Insert Special Characters</label><br>
				<div id="insert-translit_edition" class="hidden translit translit-edition"></div>
				<input type="text" id="translit_edition" class="hidden translit translit-edition input-base">
			</div>

			<language-select required field-id="language" container-id="language-block"></language-select>

			<author-input label="Names" required unlisted-option></author-input>

			<corporate-organization-input></corporate-organization-input>

			<meta-input label="Name of publisher" field-id="publisher" input-class="conditional translit-listen"
				help-text="Record the name of the publisher as it appears on the piece. Prefer the name that appears on the title page."
				sp-chars unlisted-option required></meta-input>

			<div id="translit-publisher-block"
				class="translit-publisher-block translit-block hidden standard-translit-block standard-block">
				<label for="translit_publisher" class="hidden translit heading translit-publisher">Transliterated
					publisher</label><label for="translit_publisher"
					class="insert insert_normal hidden translit translit-publisher text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					onClick='insertMenu("translit_publisher");'>Insert Special Characters</label><br>
				<div id="insert-translit_publisher" class="hidden translit translit-publisher"></div>
				<input type="text" id="translit_publisher" class="hidden translit translit-publisher input-base">
			</div>

			<div id="place-block" class="standard-block">
				<label for="place" class="heading">Place of publication<span
						class="required_marker text-red-600">*</span></label><label for="place"
					class="insert insert_normal text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					onClick='insertMenu("place");'>Insert Special Characters</label><br>
				<div id="insert-place"></div>
				<input type="text" required id="place" class="conditional translit-listen input-base">
				<label
					title="Record the place of publication as it appears on the piece. Prefer the place that appears on the title page. If there is more than one place, record only one. E.g., Boston, Massachusetts"><span
						class="question-mark text-gray-500 ml-2 cursor-help">?</span></label><br>
				<div class="mt-2">
					<span class="unlisted text-sm text-gray-600">Unlisted</span><input type="checkbox" id="place_listed"
						class="listed ml-2">
				</div>
			</div>

			<div id="translit-place-block"
				class="translit-place-block translit-block hidden standard-translit-block standard-block">
				<label for="translit_place" class="hidden translit heading translit-place">Transliterated
					place</label><label for="translit_place"
					class="insert insert_normal hidden translit translit-publisher text-sm text-uva-orange hover:underline cursor-pointer ml-2"
					onClick='insertMenu("translit_place");'>Insert Special Characters</label><br>
				<div id="insert-translit_place" class="hidden translit translit-publisher"></div>
				<input type="text" id="translit_place" class="hidden translit translit-place input-base">
			</div>

			<meta-input container-id="country-block" label="Country/State/Province of publication" field-id="country"
				required country input-class="conditional"
				help-text="Select the country of publication from the drop-down menu. If published in the United States, Canada, Australia, or the United Kingdom, select the state, province, or geographic region"
				unlisted-option></meta-input>

			<meta-input container-id="publication-block" label="Date of publication" field-id="year" required date
				help-text="Record the year of publication if it appears on the piece. Do not record a copyright date here. Copyright dates should be recorded in the next field."
				unlisted-option></meta-input>

			<meta-input container-id="copyright-block" label="Copyright date" field-id="cyear" date
				help-text="Record the year of copyright if it appears on the piece." unlisted-option></meta-input>

			<div id="pages-block" class="standard-block">
				<label for="number" class="heading">Number of<span class="required_marker text-red-600">*</span></label>
				<select name="vorp" id="vorp" class="input-base mb-2 w-auto">
					<option selected value="pages">pages</option>
					<option value="volumes">volumes</option>
				</select><br>
				<input type="text" required id="pages" class="conditional input-base w-32">
				<label
					title="Record the number of pages in each numbered sequence. E.g., 356 or xii, 254. Record the number from the last numbered page, and do not include unnumbered pages. 
	If a multi-volume set, do not record the number of pages, but instead record the number of physical volumes, E.g., 4"><span
						class="question-mark text-gray-500 ml-2 cursor-help">?</span></label><br>
				<div class="mt-2">
					<span class="unlisted text-sm text-gray-600">Unpaged</span><input type="checkbox" id="pages_listed"
						class="listed ml-2">
				</div>
			</div>

			<div id="dimensions-block" class="standard-block">
				<label for="dimensions" class="heading">Dimensions<span class="required_marker">*</span></label><br>
				<div class="flex items-center gap-2">
					<input type="text" required id="dimensions" class="required input-base w-32"> <span>cm</span>
				</div>
				<label
					title="Record the height of the piece in cm. Always round up, so that if a piece measures 25.1 cm, record 26 cm"><span
						class="question-mark text-gray-500 ml-2 cursor-help">?</span></label>
			</div>

			<div id="literature-block" class="standard-block">
				<label for="literature" class="heading">Is this item literature?</label><br>
				<div class="flex gap-4 my-2">
					<label class="flex items-center gap-2"><input type="radio" name="literature" id="literature-yes"
							value="yes">Yes</label>
					<label class="flex items-center gap-2"><input type="radio" name="literature" id="literature-no"
							value="no">No</label>
				</div>
				<select name="literature-dropdown" id="literature-dropdown" class="hidden input-base">
					<option selected disabled hidden value=''></option>
					<option value="0">Not fiction (not further specified)</option>
					<option value="1">Fiction (not further specified)</option>
					<option value="d">Dramas</option>
					<option value="e">Essays</option>
					<option value="f">Novels</option>
					<option value="h">Humor, satires, etc.</option>
					<option value="i">Letters</option>
					<option value="j">Short stories</option>
					<option value="m">Mixed forms</option>
					<option value="p">Poetry</option>
					<option value="s">Speeches</option>
					<option value="u">Unknown</option>
				</select>
			</div>

			<div id="illustrations-block" class="standard-block">
				<label for="illustrations" class="heading">Does the item include illustrations?</label><br>
				<div class="flex gap-4 my-2">
					<label class="flex items-center gap-2"><input type="radio" name="illustrations"
							id="illustrations-yes" value="yes">Yes</label>
					<label class="flex items-center gap-2"><input type="radio" name="illustrations"
							id="illustrations-no" value="no">No</label>
				</div>
				<div id="illustrations-types-container" class="mt-2">
					<label for="illustrations-types" class="block mb-1">Select up to four illustration types:</label>
					<select id="illustrations-types" multiple size="8" disabled class="input-base h-48">
						<option value="a">Illustrations</option>
						<option value="b">Maps</option>
						<option value="c">Portraits</option>
						<option value="d">Charts</option>
						<option value="e">Plans</option>
						<option value="f">Plates</option>
						<option value="g">Music</option>
						<option value="h">Facsimiles</option>
						<option value="i">Coats of arms</option>
						<option value="j">Genealogical tables</option>
						<option value="k">Forms</option>
						<option value="l">Samples</option>
						<option value="m">Phonodiscs, etc.</option>
						<option value="o">Photographs</option>
						<option value="p">Illuminations</option>
					</select>
				</div>
			</div>

			<div id="physical-form-block" class="standard-block">
				<label for="physical-form" class="heading">Physical form</label><br>
				<select id="physical-form" class="input-base">
					<option selected value="">Select a physical form</option>
					<option value=" ">None of the following</option>
					<option value="a">Microfilm</option>
					<option value="b">Microfiche</option>
					<option value="c">Microopaque</option>
					<option value="d">Large print</option>
					<option value="f">Braille</option>
					<option value="o">Online</option>
					<option value="q">Direct electronic</option>
					<option value="r">Regular print reproduction</option>
					<option value="s">Electronic</option>
				</select>
			</div>

			<div id="keywords" class="standard-block">
				<label for="keywords" class="heading">Keywords<span class="required_marker">*</span></label><br>
				<input type="text" class="fastID hidden" id="fastID0">
				<input type="number" class="fastType hidden" id="fastType0">
				<input type="text" class="fastInd hidden" id="fastInd0">
				<div class="flex gap-2 items-center mb-2">
					<input type="text" class="keyword required input-base" required id="keyword0"> <label
						title="Record, in English, any descriptive terms that describe the content of this book. Record only one term or phrase in each box. E.g., Astronomy or Politics of Egypt"><span
							class="question-mark text-gray-500 cursor-help">?</span></label>
					<input type="button" value="+" id="add-button" class="btn-primary" onClick="addKeyword();">
				</div>
			</div>

			<div id="contents-block" class="standard-block">
				<label for="contents" class="heading">Contents</label><br>
				<textarea id="contents" class="input-base h-32"></textarea>
			</div>

			<div id="notes-block" class="standard-block">
				<label for="notes" class="heading">Notes to the Cataloger</label><br>
				<textarea id="notes" class="input-base h-32"></textarea>
			</div>

			<div id="save-as-block" class="standard-block">
				<label for="filename" class="heading">Save as</label>
				<div class="flex items-center gap-2">
					<input type="text" id="filename" placeholder="record" class="input-base w-64"> <span>.[file
						type]</span>
				</div>
			</div>

			<div id="formats-block" class="standard-block">
				<label for="filetype" class="heading">Choose record formats:</label><br>
				<div class="flex flex-col gap-2">
					<label class="flex items-center gap-2"><input type="checkbox" id="MARC"
							class="filetype">MARC</label>
					<label class="flex items-center gap-2"><input type="checkbox" id="MARCXML"
							class="filetype">MARCXML</label>
					<label class="flex items-center gap-2"><input type="checkbox" id="MODS"
							class="filetype">MODS</label>
					<label class="flex items-center gap-2"><input type="checkbox" id="BIBFRAME"
							class="filetype">BIBFRAME</label>
					<label class="flex items-center gap-2"><input type="checkbox" id="HTML"
							class="filetype">HTML</label>
				</div>
			</div>

			<div id="buttons" class="standard-block flex gap-4">
				<input type="submit" value="Make" id="make" class="btn-primary">
				<input type="reset" value="Clear" id="Clear" class="btn-secondary">
			</div>

			<div id="star" class="required_marker standard-block text-sm">
				* Required field
			</div>
		</form>
		<div id="disclaimer" class="mt-8 text-sm text-gray-500 text-center">The Metadata Maker Project was funded by the
			University of Illinois at Urbana-Champaign Library's Innovation and Seed Funds.</div>
		<div id="version" class="text-xs text-gray-400 text-center mt-2">Version 1.1 – Updated on 11/10/2022</div>
		<div class="text-center mt-2"><a id="code" href="https://github.com/UIUCLibrary/metadata-maker"
				class="text-uva-blue hover:underline">GitHub</a></div>

		<script type="module" src="shared/components/corporate-organization-input.js"></script>
		<script type="module" src="shared/components/insert-diacritics.js"></script>
		<script src="shared/generalInteractionsBase.js"></script>
		<script src="metadatamaker/generalInteractions.js"></script>
		<script type="module" src="metadatamaker/downloadMARC.js"></script>
		<script src="/shared/modsBuilder.js"></script>
		<script src="metadatamaker/downloadMODS.js"></script>
		<script src="metadatamaker/downloadBIBFRAME.js"></script>
		<script src="/shared/languageLookups.js"></script>
		<script src="/shared/countryLookups.js"></script>
		<script src="/shared/htmlBuilder.js"></script>
		<script src="metadatamaker/downloadHTML.js"></script>
		<script src="shared/sharedUtils.js"></script>
		<script src="metadatamaker/submitForm.js"></script>
	</div>
</body>

</html>

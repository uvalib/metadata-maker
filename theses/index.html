<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Metadata Maker for Theses & Dissertations</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js"></script>
	<script type="module" src="/shared/components/top-navigation.js"></script>
	<script type="module" src="/shared/components/standard-text-input.js"></script>
	<script type="module" src="/shared/components/language-select.js"></script>

	<link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Raleway' rel='stylesheet' type='text/css'>
	<link href="/marcmaker.css" rel="stylesheet" media="screen">
	<link href="/top_bar.css" rel="stylesheet" media="screen">

</head>

	<script>document.documentElement.classList.add('has-js');</script>
<body class="template template-theses">
		<uv-top-navigation
		current-version="theses"
		version-label="Theses & Dissertations"
	</uv-top-navigation>

	<div id="warning_system">
		<noscript>WARNING: JavaScript is not enabled on this browser. This page requires JavaScript to function correctly.</noscript>
		<script src="metadatamaker/checkServer.js"></script>
	</div>
	<div id="content">
		<form id="marc-maker">
			<standard-text-input
				container-id="title-block"
				heading="Title"
				field-id="title"
				required
				required-marker="*"
				input-class="required"
				help-text="Record the title as it appears on the title page. If the title includes a subtitle, record only the main title here, and the subtitle in the next field."
			></standard-text-input>

			<div id="author-block" class="standard-block">
				<label for="author" class="heading">Names<span class="required_marker">*</span></label><label for="family_name" class="insert insert_family_name" onClick='insertMenu("family_name");'>Insert Special Characters</label><label for="given_name" class="insert insert_given_name" onClick='insertMenu("given_name");'>Insert Special Characters</label><br>
				<div id="insert-family_name"></div><div id="insert-given_name"></div>
				<span class="author-entry">
					<input type="text" class="author conditional" required id="family_name" placeholder="Family Name">,
					<input type="text" class="author conditional" required id="given_name" placeholder="Given Name">
					<select id="role">
						<option value="dis" selected>dissertant</option>
					</select>
				</span>
				<label title="Enter the dissertant first. Use the add button to list committee members, advisors, and other contributors."><span class="question-mark">?</span></label>
				<div class="author-actions">
					<input type="button" value="+" id="add-author" onClick="addAuthor();">
				</div>
			</div>

			<corporate-organization-input required="false"></corporate-organization-input>

															<language-select
			required
			field-id="language"
			container-id="language-block"
		></language-select>

			<div id="publication-block">
				<label for="date" class="heading">Date of publication<span class="required_marker">*</span></label><br>
				<input type="number" class="date" required id="year" min="0">
				<label title="Record the year of publication if it appears on the piece. Do not record a copyright date here. Copyright dates should be recorded in the next field."><span class="question-mark">?</span></label><br>
			</div>

			<div id="dissertation_type-block" class="standard-block">
				<label for="dissertation_type" class="heading">Dissertation Type<span class="required_marker">*</span></label><br>
				<select required id="dissertation_type">
					<option selected disabled hidden value=''></option>
					<option value="BA">BA</option>
					<option value="BS">BS</option>
					<option value="Ed.D">Ed.D</option>
					<option value="MA">MA</option>
					<option value="MS">MS</option>
					<option value="PhD">PhD</option>
				</select>
			</div>

			<div id="major-block" class="standard-block">
				<label for="major" class="heading">Major<span class="required_marker">*</span></label><br>
				<input type="text" required id="major">
			</div>

			<div id="pages-block" class="standard-block">
				<label for="number" class="heading">Number of<span class="required_marker">*</span></label>
				<select name="lorp" id="lorp">
					<option selected value="pages">pages</option>
					<option value="leaves">leaves</option>
				</select><br>
				<input type="number" required id="pages" min="1">
			</div>

			<div id="abstract-block" class="standard-block">
				<label for="abstract" class="heading">Abstract/Summary</label><br>
				<textarea id="abstract" rows="3"></textarea>
			</div>

			<div id="contents-block" class="standard-block">
				<label for="contents" class="heading">Contents</label><br>
				<textarea id="contents"></textarea>
			</div>

			<div id="bibliographies-block" class="standard-block">
				<label for="bib" class="heading">Bibliographic references page(s)</label><br>
				<input type="text" id="bib">
			</div>

			<div id="illustrations-block" class="standard-block">
				<label for="illustrations" class="heading">Does the item include illustrations?</label><br>
				<input type="radio" name="illustrations" id="illustrations-yes" value="yes">Yes
				<input type="radio" name="illustrations" id="illustrations-no" value="no">No
			</div>

			<div id="physical-form-block" class="standard-block">
				<label for="physical-form" class="heading">Physical form</label><br>
				<select id="physical-form">
					<option selected value="">Select a physical form</option>
					<option value=" ">None of the following</option>
					<option value="a">Microfilm</option>
					<option value="b">Microfiche</option>
					<option value="c">Microopaque</option>
					<option value="d">Large print</option>
					<option value="f">Braille</option>
					<option value="o">Online</option>
					<option value="q">Direct electronic</option>
					<option value="r">Regular print reproduction</option>
					<option value="s">Electronic</option>
				</select>
			</div>

			<div id="save-as-block">
				<label for="filename">Save as</label>
				<input type="text" id="filename" placeholder="record">.[file type]
			</div>

			<div id="formats-block" class="standard-block">
				<label for="filetype">Choose record formats:</label><br>
				<input type="checkbox" id="MARC" class="filetype">MARC<br>
				<input type="checkbox" id="MARCXML" class="filetype">MARCXML<br>
				<input type="checkbox" id="MODS" class="filetype">MODS<br>
				<input type="checkbox" id="HTML" class="filetype">HTML<br>
			</div>

			<div id="buttons" class="standard-block">
				<input type="submit" value="Make" id="make">
				<input type="reset" value="Clear" id="Clear">
			</div>
		</form>
		<div id="disclaimer">The Metadata Maker Project was funded by the University of Illinois at Urbana-Champaign Library's Innovation and Seed Funds.</div>
		<div id="version">Version 1.1 – Updated on 11/10/2022. Metadata Maker for Theses & Dissertations created on 4/21/2015.</div>
		<a id="code" href="https://github.com/UIUCLibrary/metadata-maker/tree/Theses-%26-Dissertations">GitHub</a></div>

		<script type="module" src="../shared/components/corporate-organization-input.js"></script>
		<script type="module" src="../shared/components/insert-diacritics.js"></script>
		<script src="../shared/generalInteractionsBase.js"></script>
		<script src="metadatamaker/generalInteractions.js"></script>
		<script type="module" src="metadatamaker/downloadMARC.js"></script>
		<script src="metadatamaker/downloadMODS.js"></script>
		<script src="metadatamaker/downloadHTML.js"></script>
		<script src="metadatamaker/submitForm.js"></script>
	</div>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Metadata Maker for Data Set</title>
	<!-- Tailwind CSS CDN -->
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		// Tailwind config for UVA branding
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'uva-blue': '#00205b',
						'uva-orange': '#ff8200',
					},
					fontFamily: {
						sans: ['"Inter"', 'system-ui', 'sans-serif'],
					},
				},
			},
		};
	</script>
	<!-- Top navigation styles -->
	<link href="/top_bar.css" rel="stylesheet" media="screen">
	<!-- Component scripts (no jQuery) -->
	<script type="module" src="/shared/components/top-navigation.js"></script>
	<script type="module" src="/shared/components/standard-text-input.js"></script>
	<script type="module" src="/shared/components/language-select.js"></script>
	<link href="https://fonts.googleapis.com/css?family=Inter" rel="stylesheet" />
	<style type="text/tailwindcss">
		@layer components {
			.standard-block {
				@apply bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6;
			}
			.heading {
				@apply block text-lg font-bold text-uva-blue mb-2;
			}
			.input-base {
				@apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-uva-orange focus:border-transparent;
			}
			.btn-primary {
				@apply bg-uva-blue text-white px-4 py-2 rounded hover:bg-blue-900 transition-colors cursor-pointer;
			}
			.btn-secondary {
				@apply bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition-colors cursor-pointer;
			}
			.required_marker {
				@apply text-red-600 ml-1;
			}
			/* Legacy overrides */
			.hidden { display: none; }
		}
	</style>
</head>

<body class="template template-dataset template-corporate template-no-translit-offset bg-gray-50 text-gray-900">
	<script>document.documentElement.classList.add('has-js');</script>
	<uv-top-navigation current-version="dataset" version-label="Data Sets"></uv-top-navigation>
	<div id="warning_system">
		<noscript>WARNING: JavaScript is not enabled on this browser. This page requires JavaScript to function
			correctly.</noscript>
		<script src="../shared/checkServer.js"></script>
	</div>
	<div id="content" class="max-w-4xl mx-auto p-4">
		<form id="marc-maker" class="space-y-6">
			<standard-text-input container-id="title-block" heading="Title" field-id="title" required
				required-marker="*" input-class="required translit-listen"
				help-text="Record the title as it appears on the title page. If the title includes a subtitle, record only the main title here, and the subtitle in the next field."></standard-text-input>
			<standard-text-input container-id="subtitle-block" heading="Subtitle" field-id="subtitle"
				input-class="conditional" help-text="Record the subtitle if one exists" unlisted></standard-text-input>
			<div id="translit-title-block"
				class="translit-title-block translit-block standard-translit-block translit-title hidden standard-block">
				<label for="translit_title" class="hidden translit heading translit-title">Transliterated title</label>
				<label for="translit_title" class="insert insert_normal hidden translit translit-title"
					onClick='insertMenu("translit_title");'>Insert Special Characters</label><br />
				<div id="insert-translit_title" class="hidden translit translit-title"></div>
				<input type="text" id="translit_title" class="hidden translit translit-title" />
			</div>
			<div id="translit-subtitle-block"
				class="translit-title-block translit-block standard-translit-block translit-title hidden standard-block">
				<label for="translit_subtitle" class="hidden translit heading translit-title">Transliterated
					subtitle</label>
				<label for="translit_subtitle" class="insert insert_normal hidden translit translit-title"
					onClick='insertMenu("translit_subtitle");'>Insert Special Characters</label><br />
				<div id="insert-translit_subtitle" class="hidden translit translit-title"></div>
				<input type="text" id="translit_subtitle" class="hidden translit translit-title" />
			</div>
			<language-select required field-id="language" container-id="language-block"></language-select>
			<div id="names_title" class="heading mb-2">Names<br /></div>
			<div id="author-block" class="space-y-2 standard-block">
				<label for="author" class="heading">Personal<span class="required_marker">*</span></label>
				<label for="family_name"
					class="insert insert_family_name text-uva-orange hover:underline cursor-pointer ml-2 text-sm"
					onClick='insertMenu("family_name");'>Insert Special Characters</label>
				<label for="given_name"
					class="insert insert_given_name text-uva-orange hover:underline cursor-pointer ml-2 text-sm"
					onClick='insertMenu("given_name");'>Insert Special Characters</label><br />
				<div id="insert-family_name"></div>
				<div id="insert-given_name"></div>
				<div class="flex flex-wrap gap-2">
					<input type="text"
						class="author conditional translit-listen border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-uva-blue focus:border-transparent flex-1"
						required id="family_name" placeholder="Family Name" />
					<input type="text"
						class="author conditional translit-listen border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-uva-blue focus:border-transparent flex-1"
						required id="given_name" placeholder="Given Name" />
					<select name="role" id="role"
						class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-uva-blue focus:border-transparent w-auto">
						<option value="art">artist</option>
						<option selected value="aut">author</option>
						<option value="ctb">contributor</option>
						<option value="edt">editor</option>
						<option value="ill">illustrator</option>
						<option value="trl">translator</option>
					</select>
				</div>
				<label
					title="Enter the name of authors, editors, illustrators, etc. listed on the piece and select the appropriate role from the drop down menu. Authors should be listed first."><span
						class="question-mark text-uva-orange cursor-help">?</span></label>
				<input type="button" value="+" id="add-author" onClick="addAuthor();" class="btn-secondary ml-2" />
				<br />
				<span class="unlisted text-sm text-gray-600">Unlisted</span><input type="checkbox" id="author_listed"
					class="listed ml-1" />

				<div id="translit-family_name-block"
					class="translit-family_name-block translit-block translit-author hidden mt-2 p-2 bg-gray-50 rounded border border-gray-200">
					<label for="translit_family_name"
						class="hidden translit heading translit-family_name block text-sm font-bold text-gray-700">Transliterated
						name</label>
					<label for="translit_family_name"
						class="insert insert_family_name hidden translit translit-family_name text-uva-orange hover:underline cursor-pointer text-xs"
						onClick='insertMenu("translit_family_name");'>Insert Special Characters</label>
					<label for="translit_given_name"
						class="insert insert_given_name hidden translit translit-family_name text-uva-orange hover:underline cursor-pointer text-xs ml-2"
						onClick='insertMenu("translit_given_name");'>Insert Special Characters</label><br />
					<div id="insert-translit_family_name"></div>
					<div id="insert-translit_given_name" class="insert-given_name"></div>
					<div class="flex gap-2">
						<input type="text" id="translit_family_name"
							class="hidden translit translit-family_name border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-uva-blue focus:border-transparent flex-1"
							placeholder="Transliterated Family Name" />
						<input type="text" id="translit_given_name"
							class="hidden translit translit-family_name border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-uva-blue focus:border-transparent flex-1"
							placeholder="Transliterated Given Name" />
					</div>
				</div>
			</div>

			<div class="standard-block">
				<corporate-organization-input></corporate-organization-input>
			</div>

			<standard-text-input container-id="publisher-block" heading="Publisher" field-id="publisher"
				input-class="translit-listen"
				help-text="Record the name of the publisher as it appears on the piece."></standard-text-input>

			<div id="translit-publisher-block"
				class="translit-publisher-block translit-block standard-translit-block translit-publisher hidden standard-block">
				<label for="translit_publisher" class="hidden translit heading translit-publisher">Transliterated
					publisher</label>
				<label for="translit_publisher"
					class="insert insert_normal hidden translit translit-publisher text-uva-orange hover:underline cursor-pointer ml-2 text-sm"
					onClick='insertMenu("translit_publisher");'>Insert Special Characters</label><br />
				<div id="insert-translit_publisher" class="hidden translit translit-publisher"></div>
				<input type="text" id="translit_publisher" class="hidden translit translit-publisher input-base" />
			</div>

			<standard-text-input container-id="place-block" heading="Place of publication" field-id="place"
				input-class="translit-listen"
				help-text="Record the place of publication (city) as it appears on the piece."></standard-text-input>

			<div id="translit-place-block"
				class="translit-place-block translit-block standard-translit-block translit-place hidden standard-block">
				<label for="translit_place" class="hidden translit heading translit-place">Transliterated place</label>
				<label for="translit_place"
					class="insert insert_normal hidden translit translit-place text-uva-orange hover:underline cursor-pointer ml-2 text-sm"
					onClick='insertMenu("translit_place");'>Insert Special Characters</label><br />
				<div id="insert-translit_place" class="hidden translit translit-place"></div>
				<input type="text" id="translit_place" class="hidden translit translit-place input-base" />
			</div>

			<div id="country-block" class="standard-block">
				<label for="country" class="heading">Country of publication</label><br />
				<input type="text" id="country" class="input-base"
					placeholder="e.g. United States, United Kingdom, etc." />
				<label title="Record the country of publication."><span
						class="question-mark text-uva-orange cursor-help">?</span></label>
			</div>

			<div id="publication-block" class="standard-block">
				<label for="year" class="heading">Date of publication<span
						class="required_marker">*</span></label><br />
				<input type="number" class="date conditional input-base w-32" required id="year" min="0" />
				<label
					title="Record the year of publication if it appears on the piece. Do not record a copyright date here. Copyright dates should be recorded in the next field."><span
						class="question-mark text-uva-orange cursor-help">?</span></label><br />
				<span class="unlisted text-sm text-gray-600">Unlisted</span><input type="checkbox" id="year_listed"
					class="listed ml-1" />
			</div>

			<div id="copyright-block" class="standard-block">
				<label for="cyear" class="heading">Copyright date<span class="required_marker">*</span></label><br />
				<input type="number" class="date conditional input-base w-32" required id="cyear" min="0" />
				<label title="Record the year of copyright if it appears on the piece."><span
						class="question-mark text-uva-orange cursor-help">?</span></label><br />
				<span class="unlisted text-sm text-gray-600">Unlisted</span><input type="checkbox" id="cyear_listed"
					class="listed ml-1" />
			</div>

			<standard-text-input container-id="web-url-block" heading="Web URL" field-id="web-url"
				help-text="Record the URL of the website if applicable."></standard-text-input>

			<standard-text-input container-id="format-block" heading="File format"
				field-id="format"></standard-text-input>
			<standard-text-input container-id="size-block" heading="File size" field-id="size"></standard-text-input>
			<standard-text-input container-id="daterange-block" heading="Date range of content"
				field-id="daterange"></standard-text-input>
			<standard-text-input container-id="datecollected-block" heading="Date the data was collected"
				field-id="datecollected"></standard-text-input>
			<standard-text-input container-id="gcoverage-block" heading="Geographic coverage"
				field-id="gcoverage"></standard-text-input>
			<standard-text-input container-id="access_terms-block" heading="Access restrictions"
				field-id="access_terms"></standard-text-input>
			<standard-text-input container-id="use_terms-block" heading="Use restrictions"
				field-id="use_terms"></standard-text-input>

			<div id="keywords" class="standard-block">
				<label for="keywords" class="heading">Keywords<span class="required_marker">*</span></label><br />
				<input type="text" class="fastID hidden" id="fastID0" />
				<input type="number" class="fastType hidden" id="fastType0" />
				<input type="text" class="fastInd hidden" id="fastInd0" />
				<div class="flex gap-2 items-center mb-2">
					<input type="text" class="keyword required input-base" required id="keyword0" />
					<label
						title="Record, in English, any descriptive terms that describe the content of this book. Record only one term or phrase in each box. E.g., Astronomy or Politics of Egypt"><span
							class="question-mark text-uva-orange cursor-help">?</span></label>
					<input type="button" value="+" id="add-button" onClick="addKeyword();" class="btn-primary ml-2" />
				</div>
			</div>

			<div id="contents-block" class="standard-block">
				<label for="contents" class="heading">Contents</label><br />
				<textarea id="contents" class="input-base h-32"></textarea>
			</div>

			<div id="notes-block" class="standard-block">
				<label for="notes" class="heading">Notes to the Cataloger</label><br />
				<textarea id="notes" class="input-base h-32"></textarea>
			</div>

			<div id="save-as-block" class="standard-block">
				<label for="filename" class="heading">Save as</label><br />
				<div class="flex items-center">
					<input type="text" id="filename" placeholder="record" class="input-base w-64" />
					<span class="ml-2">.[file type]</span>
				</div>
			</div>

			<div id="formats-block" class="standard-block">
				<label class="heading">Choose record formats:</label><br />
				<div class="space-y-1">
					<label class="flex items-center"><input type="checkbox" id="MARC"
							class="filetype mr-2" />MARC</label>
					<label class="flex items-center"><input type="checkbox" id="MARCXML"
							class="filetype mr-2" />MARCXML</label>
					<label class="flex items-center"><input type="checkbox" id="MODS"
							class="filetype mr-2" />MODS</label>
					<label class="flex items-center"><input type="checkbox" id="HTML"
							class="filetype mr-2" />HTML</label>
				</div>
			</div>
			<div id="buttons" class="standard-block flex gap-4">
				<input type="submit" value="Make" id="make" class="btn-primary" />
				<input type="reset" value="Clear" id="Clear" class="btn-secondary" />
			</div>
			<div id="star" class="required_marker mt-2">* Required field</div>
		</form>
		<div id="disclaimer" class="mt-4 text-sm text-gray-600">The Metadata Maker Project was funded by the University
			of Illinois at Urbana-Champaign Library's Innovation and Seed Funds.</div>
		<div id="version" class="mt-2 text-xs text-gray-500">Version 1.1 – Updated on 11/10/2022. Metadata Maker for
			Data Set was created on ...</div>
		<a id="code" href="https://github.com/UIUCLibrary/metadata-maker/tree/DataSet"
			class="text-blue-600 hover:underline">GitHub</a>
	</div>
	<script type="module" src="../shared/components/corporate-organization-input.js"></script>
	<script type="module" src="../shared/components/insert-diacritics.js"></script>
	<script src="../shared/generalInteractionsBase.js"></script>
	<script src="metadatamaker/generalInteractions.js"></script>

	<!-- Shared Builders (Must be loaded before download scripts) -->
	<script src="../shared/modsBuilder.js"></script>
	<script src="../shared/htmlBuilder.js"></script>

	<script type="module" src="metadatamaker/downloadMARC.js"></script>
	<script src="metadatamaker/downloadMODS.js"></script>
	<script src="/shared/languageLookups.js"></script>
	<script src="/shared/countryLookups.js"></script>
	<script src="metadatamaker/downloadHTML.js"></script>
	<script src="../shared/sharedUtils.js"></script>
	<script src="metadatamaker/submitForm.js"></script>
</body>

</html>

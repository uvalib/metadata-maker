<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<script>document.documentElement.classList.add('has-js');</script>
	<title>Metadata Maker for Archival Collections</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js"></script>
	<script src="/assignFAST/assignFASTExample.js"></script>
	<script src="/assignFAST/assignFASTGadget.js"></script>
	<script src="/assignFAST/assignFASTComplete.js"></script>
	<script type="module" src="/shared/components/top-navigation.js"></script>
	<script type="module" src="/shared/components/standard-text-input.js"></script>
	<script type="module" src="/shared/components/standard-date-input.js"></script>
	<script type="module" src="/shared/components/repeatable-text-input.js"></script>
	<script type="module" src="/shared/components/repeatable-extent-input.js"></script>
	<script type="module" src="/shared/components/originator-input.js"></script>

	<link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/themes/smoothness/jquery-ui.css" rel="stylesheet">
	<link href="https://jqueryui.com/jquery-wp-content/themes/jqueryui.com/style.css" rel="stylesheet">
	<link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Roboto+Slab' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Raleway' rel='stylesheet' type='text/css'>
	<link href="/marcmaker.css" rel="stylesheet" media="screen">
	<link href="/top_bar.css" rel="stylesheet" media="screen">

</head>

<body class="template template-govdocs template-corporate">
		<uv-top-navigation
		current-version="archives"
		version-label="Archival Collections"
		versions="dataset,ebooks,govdocs,archives,maps,monographs,scores,serials,theses">
	</uv-top-navigation>

	<div id="warning_system">
		<noscript>WARNING: JavaScript is not enabled on this browser. This page requires JavaScript to function correctly.</noscript>
		<script src="metadatamaker/checkServer.js"></script>
	</div>
	<div id="content">
		<form id="marc-maker">
			<standard-text-input
				heading="Repository name"
				field-id="repository_name"
				required
				required-marker="*"
				input-class="required translit-listen"
			></standard-text-input>

			<repeatable-text-input
				heading="Repository address"
				field-prefix="repository_address"
				input-class="repository-address-input translit-listen"
				add-button-id="add-repository-address"
				add-button-aria-label="Add repository address line"
			></repeatable-text-input>

			<standard-text-input
				heading="Location in repository"
				field-id="repository_location"
				input-class="translit-listen"
			></standard-text-input>

			<standard-text-input
				container-id="title-block"
				heading="Title"
				field-id="title"
				required
				required-marker="*"
				input-class="required translit-listen"
				help-text="Record the title as it appears on the title page. If the title includes a subtitle, record only the main title here, and the subtitle in the next field."
			></standard-text-input>

			<standard-text-input
				container-id="subtitle-block"
				heading="Subtitle"
				field-id="subtitle"
				input-class="conditional"
				help-text="Record the subtitle if one exists"
				unlisted
			></standard-text-input>

			<div id="translit-title-block" class="translit-title-block translit-block standard-translit-block translit-title hidden">
				<label for="translit_title" class="hidden translit heading translit-title">Transliterated title</label><label for="translit_title" class="insert insert_normal hidden translit translit-title" style="left: -13px;" onClick='insertMenu("translit_title");'>Insert Special Characters</label><br>
				<div id="insert-translit_title" class="hidden translit translit-title"></div>
				<input type="text" id="translit_title" class="hidden translit translit-title">
			</div>

			<div id="translit-subtitle-block" class="translit-title-block translit-block standard-translit-block translit-title hidden">
				<label for="translit_subtitle" class="hidden translit heading translit-title">Transliterated subtitle</label><label for="translit_subtitle" class="insert insert_normal hidden translit translit-title" onClick='insertMenu("translit_subtitle");'>Insert Special Characters</label><br>
				<div id="insert-translit_subtitle" class="hidden translit translit-title"></div>
				<input type="text" id="translit_subtitle" class="hidden translit translit-title">
			</div>

			<standard-text-input
				container-id="identifier-block"
				heading="Identifier"
				field-id="identifier"
				required
				required-marker="*"
				input-class="required"
			></standard-text-input>

			<originator-input required></originator-input>

			<div id="coverage-block" class="standard-block">
				<label class="heading">Coverage date(s)</label>
				<div class="coverage-fields">
					<standard-date-input
						container-class="coverage-field"
						field-id="coverage_start"
						heading="Start date"
						input-class="coverage-start"
						required
						required-marker="*"
					></standard-date-input>

					<standard-date-input
						container-class="coverage-field"
						field-id="coverage_end"
						heading="End date"
						input-class="coverage-end"
					></standard-date-input>

					<div class="coverage-field">
						<label for="coverage_type" class="heading">Coverage date type</label><br>
						<select id="coverage_type" class="coverage-type" required>
							<option value="bulk">bulk</option>
							<option value="inclusive">inclusive</option>
						</select>
					</div>
				</div>
			</div>

			<repeatable-text-input
				heading="Language"
				field-prefix="language"
				input-class="language-input translit-listen required"
				add-button-id="add-language"
				add-button-aria-label="Add language"
				required
			></repeatable-text-input>

			<repeatable-extent-input
				heading="Extent"
				field-prefix="extent"
				required
			></repeatable-extent-input>

			<div class="standard-block" id="dimensions-block">
				<label class="heading">Dimensions</label>
				<standard-text-input
					container-class="extent-field"
					field-id="dimensions_text"
					heading="Value"
					input-class="dimensions-text"
					required
					required-marker="*"
				></standard-text-input>
				<div class="extent-field">
					<label for="dimensions_units" class="heading">Units</label><br>
					<select id="dimensions_units" class="dimensions-units" required>
						<option value="linear ft.">linear ft.</option>
						<option value="cubic ft.">cubic ft.</option>
					</select>
				</div>
			</div>

						<div id="illustrations-block" class="standard-block">
				<label for="illustrations" class="heading">Does the item include illustrations?</label><br>
				<input type="radio" name="illustrations" id="illustrations-yes" value="yes">Yes
				<input type="radio" name="illustrations" id="illustrations-no" value="no">No
			</div>

			<div id="keywords" class="standard-block">
				<label for="keywords" class="heading">Keywords<span class="required_marker">*</span></label><br>
				<input type="text" class="fastID hidden" id="fastID0">
				<input type="number" class="fastType hidden" id="fastType0">
				<input type="text" class="fastInd hidden" id="fastInd0">
				<input type="text" class="keyword required" required id="keyword0"> <label title="Record, in English, any descriptive terms that describe the content of this book. Record only one term or phrase in each box. E.g., Astronomy or Politics of Egypt"><span class="question-mark">?</span></label>
				<input type="button" value="+" id="add-button" onClick="addKeyword();">
			</div>

			<div id="contents-block" class="standard-block">
				<label for="contents" class="heading">Contents</label><br>
				<textarea id="contents"></textarea>
			</div>

			<div id="notes-block">
				<label for="notes">Notes to the Cataloger</label><br>
				<textarea id="notes"></textarea>
			</div>

			<div id="save-as-block">
				<label for="filename">Save as</label>
				<input type="text" id="filename" placeholder="record">.[file type]
			</div>

			<div id="formats-block" class="standard-block">
				<label for="filetype">Choose record formats:</label><br>
				<input type="checkbox" id="MARC" class="filetype">MARC<br>
				<input type="checkbox" id="MARCXML" class="filetype">MARCXML<br>
				<input type="checkbox" id="MODS" class="filetype">MODS<br>
				<input type="checkbox" id="HTML" class="filetype">HTML
			</div>

			<div id="buttons" class="standard-block">
				<input type="submit" value="Make" id="make">
				<input type="reset" value="Clear" id="Clear">
			</div>

			<div id="star" class="required_marker standard-block">
				* Required field
			</div>
		</form>
		<div id="disclaimer">The Metadata Maker Project was funded by the University of Illinois at Urbana-Champaign Library's Innovation and Seed Funds.</div>
		<div id="version">Version 1.1 – Updated on 11/10/2022. Metadata Maker for Government Documents created on 08/10/2015.</div>
		<a id="code" href="https://github.com/UIUCLibrary/metadata-maker/tree/GovDocs">GitHub</a></div>
		
		<script type="module" src="../shared/components/corporate-organization-input.js"></script>
		<script type="module" src="../shared/components/insert-diacritics.js"></script>
		<script src="../shared/generalInteractionsBase.js"></script>
		<script src="metadatamaker/generalInteractions.js"></script>
		<script type="module" src="metadatamaker/downloadMARC.js"></script>
		<script src="metadatamaker/downloadMODS.js"></script>
		<script src="metadatamaker/downloadHTML.js"></script>
		<script src="metadatamaker/submitForm.js"></script>
	</div>
</body>

</html>
